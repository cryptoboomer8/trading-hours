<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orion Screener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Set the theme before the first paint, so a light theme doesn't flash dark.
    try { document.documentElement.className = 'theme-' + (localStorage.getItem('viz-theme') || 'dark'); } catch (e) {}
  </script>
  <style>
    /* The two dashboards run as separate pages in frames below this bar. The
       bar owns the tabs, the last-updated status and the theme switch. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html.theme-dark {
      --bg: #060b12; --surface: #0d1520; --surface-hover: #131d2e;
      --border: rgba(0,255,255,0.08);
      --text: #e8ecf1; --text-secondary: #6b7f99;
      --accent: #00e5ff; --positive: #00e676; --negative: #ff1744;
      --glow-cyan: rgba(0,229,255,0.12); --glow-magenta: rgba(224,64,251,0.12);
    }
    html.theme-light {
      --bg: #f0f4f8; --surface: #ffffff; --surface-hover: #e8edf3;
      --border: rgba(0,0,0,0.08);
      --text: #0f172a; --text-secondary: #64748b;
      --accent: #0891b2; --positive: #059669; --negative: #e11d48;
      --glow-cyan: rgba(8,145,178,0.06); --glow-magenta: rgba(147,51,234,0.06);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
    }
    /* The frames are transparent, so this glow runs on behind both pages. */
    .bg-atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 15% 30%, var(--glow-cyan) 0%, transparent 50%), radial-gradient(ellipse at 85% 70%, var(--glow-magenta) 0%, transparent 50%); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    .shellbar { flex: none; display: flex; align-items: center; gap: 12px 28px; padding: 10px 20px 0; position: relative; z-index: 1; }
    .brand { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); white-space: nowrap; }
    .tabs { display: flex; gap: 4px; align-self: stretch; }
    .tab { padding: 6px 14px 8px; border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--text-secondary); font: 600 1.15rem/1.2 'Inter', sans-serif; letter-spacing: -0.02em; cursor: pointer; white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .status { margin-left: auto; font-size: 0.72rem; color: var(--text-secondary); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--positive); margin-right: 8px; animation: pulse 2s infinite; }
    .status-dot.stale { background: var(--negative); animation: none; }
    .theme-btn { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 1rem; }
    .theme-btn:hover { background: var(--surface-hover); }

    .frames { flex: 1 1 auto; position: relative; z-index: 1; }
    .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; visibility: hidden; }
    .frames iframe.active { visibility: visible; }

    @media (max-width: 640px) {
      .brand { display: none; }
      .shellbar { flex-wrap: wrap; padding: 8px 12px 0; }
      .tab { font-size: 1rem; padding: 6px 10px 8px; }
    }
  </style>
</head>
<body>
  <div class="bg-atmosphere"></div>
  <header class="shellbar">
    <span class="brand">Orion Screener</span>
    <nav class="tabs" role="tablist" aria-label="Dashboards">
      <button class="tab" role="tab" id="tab-hours" data-page="hours" aria-controls="frame-hours" aria-selected="false" type="button">Trading Hours</button>
      <button class="tab" role="tab" id="tab-coins" data-page="coins" aria-controls="frame-coins" aria-selected="false" type="button">Popular Coins</button>
    </nav>
    <p class="status" aria-live="polite"><span class="status-dot" id="statusDot"></span><span id="statusText">Loading&hellip;</span></p>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch between dark and light theme"></button>
  </header>
  <div class="frames" id="frames"></div>

  <script>
    var PAGES = { hours: './trading-hours.html', coins: './popular-coins.html' };
    var TITLES = { hours: 'Trading Hours', coins: 'Popular Coins' };
    var frames = {};   // page -> iframe, created the first time its tab opens
    var statuses = {}; // page -> { text, stale }, as the page last reported it
    var current = null;
    var theme = document.documentElement.className === 'theme-light' ? 'light' : 'dark';

    function renderStatus() {
      var s = statuses[current];
      document.getElementById('statusText').textContent = s ? s.text : 'Loading…';
      document.getElementById('statusDot').className = 'status-dot' + (s && s.stale ? ' stale' : '');
    }

    function show(page) {
      if (!PAGES[page]) page = 'hours';
      if (page === current) return;
      current = page;
      if (!frames[page]) {
        var f = document.createElement('iframe');
        f.id = 'frame-' + page;
        f.src = PAGES[page];
        f.title = TITLES[page];
        f.setAttribute('role', 'tabpanel');
        f.setAttribute('aria-labelledby', 'tab-' + page);
        document.getElementById('frames').appendChild(f);
        frames[page] = f;
      }
      Object.keys(frames).forEach(function(p) { frames[p].classList.toggle('active', p === page); });
      document.querySelectorAll('.tab').forEach(function(t) { t.setAttribute('aria-selected', t.dataset.page === page ? 'true' : 'false'); });
      document.title = TITLES[page] + ' — Orion Screener';
      if (location.hash !== '#' + page) history.replaceState(null, '', '#' + page);
      renderStatus();
    }

    document.querySelector('.tabs').addEventListener('click', function(e) {
      var t = e.target.closest('.tab');
      if (t) show(t.dataset.page);
    });
    window.addEventListener('hashchange', function() { show(location.hash.slice(1)); });

    // Each page reports its last-updated text; only the open tab's is shown.
    window.addEventListener('message', function(e) {
      if (e.origin !== location.origin || !e.data || !e.data.orionStatus) return;
      Object.keys(frames).forEach(function(p) {
        if (frames[p].contentWindow === e.source) { statuses[p] = e.data.orionStatus; if (p === current) renderStatus(); }
      });
    });

    function applyTheme(t) {
      theme = t;
      document.documentElement.className = 'theme-' + t;
      document.getElementById('themeBtn').textContent = t === 'dark' ? '\u{1F319}' : '\u{2600}\u{FE0F}';
      try { localStorage.setItem('viz-theme', t); } catch (e) {}
      Object.keys(frames).forEach(function(p) { frames[p].contentWindow.postMessage({ orionTheme: t }, location.origin); });
    }
    document.getElementById('themeBtn').addEventListener('click', function() { applyTheme(theme === 'dark' ? 'light' : 'dark'); });

    applyTheme(theme);
    show(location.hash.slice(1));
  </script>
</body>
</html>
