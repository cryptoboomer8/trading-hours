<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orion Screener — Popular Coins</title>
  <script>
    // This page runs as a tab of the index page; opened on its own, go there.
    if (window.top === window.self) location.replace('./#coins');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html.theme-dark {
      --bg: #060b12; --surface: #0d1520; --surface-hover: #131d2e;
      --border: rgba(0,255,255,0.08);
      --text: #e8ecf1; --text-secondary: #6b7f99;
      --accent: #00e5ff; --volume: #e040fb; --positive: #00e676; --negative: #ff1744;
      --smma-fast: #ffab00; --smma-slow: #00e5ff;
      --session-us: rgba(255,255,255,0.08); --session-kr: rgba(68,138,255,0.14);
      --session-hk: rgba(0,230,118,0.10); --session-cn: rgba(255,82,82,0.12);
    }
    html.theme-light {
      --bg: #f0f4f8; --surface: #ffffff; --surface-hover: #e8edf3;
      --border: rgba(0,0,0,0.08);
      --text: #0f172a; --text-secondary: #64748b;
      --accent: #0891b2; --volume: #9333ea; --positive: #059669; --negative: #e11d48;
      --smma-fast: #d97706; --smma-slow: #0891b2;
      --session-us: rgba(15,23,42,0.08); --session-kr: rgba(37,99,235,0.12);
      --session-hk: rgba(5,150,105,0.12); --session-cn: rgba(225,29,72,0.10);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent; color: var(--text);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
      transition: background 0.3s, color 0.3s; scrollbar-gutter: stable;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Spacing, controls and cards match the Trading Hours tab. */
    .container { padding: 14px 20px; position: relative; z-index: 1; }

    .controls { display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; min-height: 32px; margin-bottom: 14px; }
    .ctl { display: flex; align-items: center; gap: 8px; }
    .ctl-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); white-space: nowrap; }
    .period-toggle { display: flex; gap: 3px; padding: 3px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    .period-toggle button { padding: 4px 11px; border: none; border-radius: 6px; background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 0.76rem; letter-spacing: 0.02em; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .period-toggle button:hover { color: var(--text); }
    .period-toggle button.active { background: var(--accent); color: #000; font-weight: 600; }
    .period-toggle button:disabled { cursor: not-allowed; opacity: 0.5; }
    .coin-search { padding: 5px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 0.76rem; }
    .cap-filter { font-size: 0.76rem; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .cap-filter input { accent-color: var(--accent); }
    .session-toggle { display: flex; gap: 3px; padding: 3px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    .session-toggle button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: none; border-radius: 6px; background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 0.76rem; cursor: pointer; }
    .session-toggle button:hover { color: var(--text); }
    .session-toggle button.active { color: var(--text); background: var(--surface-hover); font-weight: 600; }
    .session-toggle .swatch { width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--text-secondary); }

    .workspace { display: grid; grid-template-columns: minmax(620px, 1fr) minmax(0, 2fr); gap: 14px; align-items: start; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
    .coin-table-wrap { overflow-x: auto; }
    .coin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .coin-table th { text-align: left; font-weight: 500; font-size: 0.75rem; color: var(--text-secondary); padding: 8px 10px; }
    /* The column names stay put while the coins scroll under them. */
    .coin-table thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); box-shadow: inset 0 -1px var(--border); }
    .coin-table td { padding: 7px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
    .coin-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .coin-table tbody tr { cursor: pointer; }
    .coin-table tbody tr:hover, .coin-table tbody tr.selected { background: var(--surface-hover); }
    .coin-table svg { display: block; }
    .coin-up { color: #22c55e; }
    .coin-down, .thin-volume { color: #ef4444; }
    .coin-choppy { color: #f59e0b; }
    .coin-flat { color: var(--text-secondary); }
    .market-badge { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px solid var(--accent); border-radius: 4px; color: var(--accent); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.04em; line-height: 1.5; vertical-align: 1px; }
    .coin-note { margin: 12px 10px 4px; font-size: 0.75rem; color: var(--text-secondary); }
    .coin-detail { position: sticky; top: 14px; }
    .coin-detail h3 { font-size: 1rem; font-weight: 500; margin-bottom: 12px; }
    .chart-container { position: relative; height: calc(100vh - 140px); min-height: 420px; }

    /* On wide screens the page fits the window: the controls, the list's
       column names and the chart stay where they are, and only the coin
       list scrolls. */
    @media (min-width: 1101px) {
      html, body { height: 100%; overflow: hidden; }
      .container { height: 100%; display: flex; flex-direction: column; }
      .controls { flex: none; }
      .workspace { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
      .workspace > .card { min-height: 0; display: flex; flex-direction: column; }
      .coin-table-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
      .coin-detail h3 { flex: none; }
      .chart-container { flex: 1 1 auto; height: auto; min-height: 240px; }
    }

    @media (max-width: 1100px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .coin-detail { position: static; }
      .chart-container { height: 420px; }
      .container { padding: 14px 12px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="controls">
      <div class="ctl">
        <span class="ctl-label">Period</span>
        <div class="period-toggle" id="periodToggle" role="group" aria-label="Choose the period">
        <button class="active" data-period="7d" type="button">7D</button>
        <button data-period="1d" type="button">1D</button>
        <button data-period="12h" type="button">12H</button>
        <button data-period="6h" type="button">6H</button>
        <button data-period="4h" type="button">4H</button>
        <button data-period="2h" type="button">2H</button>
        </div>
      </div>
      <div class="ctl">
        <span class="ctl-label">Market</span>
        <div class="period-toggle" id="marketToggle" role="group" aria-label="Choose the market">
        <button class="active" data-market="all" type="button">All</button>
        <button data-market="crypto" type="button">Crypto</button>
        <button data-market="tradfi" type="button" title="Stocks, ETFs and commodities">TradFi</button>
        </div>
      </div>
      <label class="cap-filter"><input type="checkbox" id="hideHighCaps"> Hide high caps</label>
      <div class="ctl">
        <span class="ctl-label">Sessions</span>
        <div class="session-toggle" id="sessionToggle" role="group" aria-label="Shade exchange sessions on the chart">
        <button type="button" data-session="us" aria-pressed="false" title="NYSE and Nasdaq: 9:30 to 16:00 New York time, weekdays, without US market holidays"><span class="swatch" style="background: var(--session-us)"></span>US</button>
        <button type="button" data-session="kr" aria-pressed="false" title="Korea Exchange: 9:00 to 15:30 Seoul time, weekdays. Korean holidays are not left out."><span class="swatch" style="background: var(--session-kr)"></span>KR</button>
        <button type="button" data-session="hk" aria-pressed="false" title="HKEX: 9:30 to 12:00 and 13:00 to 16:00 Hong Kong time, weekdays. Hong Kong holidays are not left out."><span class="swatch" style="background: var(--session-hk)"></span>HK</button>
        <button type="button" data-session="cn" aria-pressed="false" title="Shanghai and Shenzhen: 9:30 to 11:30 and 13:00 to 15:00 Beijing time, weekdays. Chinese holidays are not left out."><span class="swatch" style="background: var(--session-cn)"></span>CN</button>
        </div>
      </div>
      <input type="search" class="coin-search" id="coinSearch" placeholder="Find a coin" aria-label="Find a coin">
    </section>

    <div class="workspace">
      <section class="card">
        <div class="coin-table-wrap">
          <table class="coin-table">
            <thead><tr><th>#</th><th>Coin</th><th class="num">Trades / 5m</th><th class="num">Volume / 5m</th><th class="num" title="Average volume per 5 minutes over the last hour">Vol / 5m 1H</th><th class="num" title="Average volume per 5 minutes over the last 2 hours">Vol / 5m 2H</th><th>Price</th><th class="num">Change</th></tr></thead>
            <tbody id="coinRows"></tbody>
          </table>
          <p class="coin-note" id="coinNote"></p>
        </div>
      </section>

      <section class="card coin-detail">
        <h3 id="coinTitle">&mdash;</h3>
        <div class="chart-container" role="img" aria-label="Price from 1-minute candles, with SMMA 30 and 120 on periods under 7 days, and volume in USDT, for the selected coin">
          <canvas id="coinChart"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script>
    var API_URL = 'https://trading-hours.cryptoboomer.workers.dev';
    var BINANCE = 'https://fapi.binance.com';
    var COIN_ROWS = 50;
    var MINUTE_MS = 60000;
    var HOUR_MS = 60 * MINUTE_MS;
    // A list older than this means the collector has stopped.
    var STALE_MS = { '7d': 3 * HOUR_MS, '1d': HOUR_MS / 2, '12h': HOUR_MS / 2, '6h': HOUR_MS / 2, '4h': HOUR_MS / 2, '2h': HOUR_MS / 2 };
    var SMMA_FAST = 30;
    var SMMA_SLOW = 120;
    // SMMA never fully forgets its starting value, so read this much earlier
    // history to let the slow line settle before the chart begins.
    var WARMUP_CANDLES = 6 * SMMA_SLOW;
    var CANDLES_PER_REQUEST = 1500;
    // The page fetches its lists and the chart again this often. Anything
    // fetched within the last 55 seconds is reused, so a refresh always refetches.
    var REFRESH_MS = MINUTE_MS;
    var REUSE_MS = REFRESH_MS - 5000;
    var CANDLE_CACHE_MS = REUSE_MS;
    // The lines are calculated on every 1-minute candle; a long period is then
    // drawn at a coarser spacing so it stays readable.
    var MAX_CHART_POINTS = 500;
    var CHART_STEPS = [1, 2, 5, 15, 30, 60];

    var currentPeriod = '7d';
    var views = {};
    var viewAt = {};
    var RECENT_PERIODS = ['1h', '2h'];
    var recentVolume = {};
    var MIN_VOLUME_PER_5M = 500000;
    var highCaps = {};
    var tradfi = {};
    // Binance's underlyingType for TradFi pairs, shown as [badge, tooltip].
    var MARKETS = {
      EQUITY: ['US', 'US stock or ETF, NYSE or Nasdaq'],
      KR_EQUITY: ['KR', 'Korean stock, Korea Exchange in Seoul'],
      HK_EQUITY: ['HK', 'Hong Kong stock or ETF, HKEX'],
      CN_EQUITY: ['CN', 'Chinese stock, Shanghai or Shenzhen'],
      COMMODITY: ['CMDTY', 'Commodity'],
      FX: ['FX', 'Currency pair'],
      PREMARKET: ['PRE-IPO', 'Company not yet listed on a stock exchange']
    };
    var currentMarket = 'all';
    var candleCache = {};
    var selectedCoin = null;
    var chartData = null;
    var coinChart = null;
    var chartRequest = 0;
    var STATE_KEY = 'popular-coins-state';
    // NYSE and Nasdaq calendar, by New York date. Extend these each year from
    // nyse.com/markets/hours-calendars.
    var US_HOLIDAYS = [
      '2026-01-01', '2026-01-19', '2026-02-16', '2026-04-03', '2026-05-25', '2026-06-19', '2026-07-03', '2026-09-07', '2026-11-26', '2026-12-25',
      '2027-01-01', '2027-01-18', '2027-02-15', '2027-03-26', '2027-05-31', '2027-06-18', '2027-07-05', '2027-09-06', '2027-11-25', '2027-12-24'
    ];
    // These days close at 13:00 New York time.
    var US_EARLY_CLOSES = ['2026-11-27', '2026-12-24', '2027-11-26'];
    // Asian sessions as [open hour, open minute, close hour, close minute] in UTC.
    // None of these markets moves its clocks, and each session falls on the
    // same date in UTC as locally.
    var ASIAN_SESSIONS = {
      kr: [[0, 0, 6, 30]],
      hk: [[1, 30, 4, 0], [5, 0, 8, 0]],
      cn: [[1, 30, 3, 30], [5, 0, 7, 0]]
    };
    var SESSION_ORDER = ['us', 'kr', 'hk', 'cn'];
    var shownSessions = [];
    var NY_PARTS = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' });

    var currentTheme = localStorage.getItem('viz-theme') || 'dark';
    function applyTheme(t) {
      document.documentElement.className = 'theme-' + t;
      currentTheme = t;
      drawChart();
    }

    // The index page sends the theme when its switch is used.
    window.addEventListener('message', function(e) {
      if (e.origin === location.origin && e.data && (e.data.orionTheme === 'dark' || e.data.orionTheme === 'light')) applyTheme(e.data.orionTheme);
    });

    // Shows text as the last-updated line in the index page's bar.
    function reportStatus(text, stale) {
      if (window.parent !== window) window.parent.postMessage({ orionStatus: { text: text, stale: !!stale } }, location.origin);
    }

    function compactNumber(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
      return String(n);
    }

    function known(values) {
      return values.filter(function(v) { return v !== null; });
    }

    // Colours the coin by the shape of its price path inside the selected period only:
    //   green  the net move up covers at least half of the period's high-low range,
    //          or it hit its low first and now sits in the top third
    //   red    the net move down covers at least half of the range,
    //          or it hit its high first and now sits in the bottom third
    //   grey   the range is too small to matter for this length of period
    //   amber  anything else, which is choppy
    // Normal price noise grows with the square root of time, so grey's cut-off
    // does too: 1% over 2 hours, about 3.5% over a day, about 9% over a week.
    function priceTrend(closes, hours) {
      if (closes.length < 2 || !closes[0]) return { change: 0, cls: '' };
      var first = closes[0], last = closes[closes.length - 1];
      var high = Math.max.apply(null, closes), low = Math.min.apply(null, closes), range = high - low;
      var trend = { change: (last / first - 1) * 100, cls: 'coin-choppy' };
      if (range / first * 100 < Math.sqrt(hours / 2)) {
        trend.cls = 'coin-flat';
        return trend;
      }
      var net = (last - first) / range, position = (last - low) / range;
      var highFirst = closes.indexOf(high) < closes.indexOf(low);
      if (net >= 0.5 || (position >= 2 / 3 && !highFirst)) trend.cls = 'coin-up';
      else if (net <= -0.5 || (position <= 1 / 3 && highFirst)) trend.cls = 'coin-down';
      return trend;
    }

    function sparkline(closes, cls) {
      var ns = 'http://www.w3.org/2000/svg', w = 90, h = 24;
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('class', cls);
      if (closes.length < 2) return svg;
      var lo = Math.min.apply(null, closes), hi = Math.max.apply(null, closes), range = hi - lo || 1;
      var points = closes.map(function(c, i) {
        return (i / (closes.length - 1) * (w - 2) + 1).toFixed(1) + ',' + (h - 2 - (c - lo) / range * (h - 4)).toFixed(1);
      });
      var line = document.createElementNS(ns, 'polyline');
      line.setAttribute('points', points.join(' ')); line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'currentColor'); line.setAttribute('stroke-width', '1.5');
      svg.appendChild(line);
      return svg;
    }

    function marketBadge(symbol) {
      var badge = document.createElement('span');
      badge.className = 'market-badge';
      badge.textContent = tradfi[symbol][0];
      badge.title = tradfi[symbol][1];
      return badge;
    }

    function coinCell(row, text, cls) {
      var td = document.createElement('td');
      td.textContent = text;
      if (cls) td.className = cls;
      row.appendChild(td);
      return td;
    }

    // Average volume per 5 minutes, red when it is below the liquidity floor.
    function volumeCell(row, volume) {
      return coinCell(row, '$' + compactNumber(volume), 'num' + (volume < MIN_VOLUME_PER_5M ? ' thin-volume' : ''));
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function timeLabel(ms) {
      var d = new Date(ms);
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function dateTimeLabel(ms) {
      var d = new Date(ms);
      return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + timeLabel(ms);
    }

    function renderHeader(view) {
      var stale = Date.now() - view.end > STALE_MS[currentPeriod];
      reportStatus((stale ? 'Stale: ' : 'Last: ') + dateTimeLabel(view.end) + ' your time, from ' + dateTimeLabel(view.start), stale);
    }

    function visibleCoins(view) {
      var hide = document.getElementById('hideHighCaps').checked;
      return view.coins.filter(function(c) {
        if (currentMarket !== 'all' && (currentMarket === 'tradfi') !== !!tradfi[c[0]]) return false;
        return !hide || !highCaps[c[0]];
      });
    }

    function setMarket(market) {
      currentMarket = market;
      document.querySelectorAll('#marketToggle button').forEach(function(b) { b.classList.toggle('active', b.dataset.market === market); });
    }

    function renderCoins() {
      var view = views[currentPeriod];
      if (!view) return;
      var slots = (view.end - view.start) / (5 * MINUTE_MS);
      var hours = (view.end - view.start) / HOUR_MS;
      var query = document.getElementById('coinSearch').value.trim().toUpperCase();
      var list = visibleCoins(view);
      var body = document.getElementById('coinRows');
      body.textContent = '';
      // A search looks through every coin, so a hidden high cap can still be found.
      var rows = query ? view.coins.filter(function(c) { return c[0].indexOf(query) !== -1; }) : list;
      rows.slice(0, COIN_ROWS).forEach(function(c) {
        var closes = known(c[3]), trend = priceTrend(closes, hours);
        var row = document.createElement('tr');
        if (c[0] === selectedCoin) row.className = 'selected';
        row.addEventListener('click', function() { selectCoin(c[0]); });
        coinCell(row, list.indexOf(c) + 1 || view.coins.indexOf(c) + 1);
        var name = coinCell(row, c[0]);
        if (tradfi[c[0]]) name.appendChild(marketBadge(c[0]));
        coinCell(row, Math.round(c[1] / slots).toLocaleString(), 'num');
        volumeCell(row, Math.round(c[2] / slots));
        RECENT_PERIODS.forEach(function(p) {
          var volumes = recentVolume[p];
          if (volumes) volumeCell(row, volumes[c[0]] || 0);
          else coinCell(row, '–', 'num');
        });
        coinCell(row, '').appendChild(sparkline(closes, trend.cls));
        coinCell(row, (trend.change >= 0 ? '+' : '') + trend.change.toFixed(1) + '%', 'num ' + trend.cls);
        body.appendChild(row);
      });
      document.getElementById('coinNote').textContent = 'Top ' + Math.min(COIN_ROWS, list.length) + ' of ' + list.length + ' coins by trades, averaged over this period. The 1H and 2H volume columns always cover the last 1 and 2 hours, whatever the period. A red volume is under $500K per 5 minutes. High cap means a crypto market cap of $1B or more, from CoinGecko. A badge marks a stock, ETF or commodity and its home market: US, KR, HK, CN or CMDTY. TradFi covers the stock, ETF and commodity perpetuals that averaged 100,000 trades a day over the last week; the rest are left out. 7D updates hourly and the rest every 5 minutes. Colours only look at this period: green or red means a mostly one-way move, or one that reversed and now sits in the top or bottom third of its range; amber is choppy; grey means the range is small for this length of period.';
    }

    function smma(closes, length) {
      var out = [], value = null, sum = 0;
      closes.forEach(function(close, i) {
        if (i < length) {
          sum += close;
          if (i === length - 1) value = sum / length;
        } else {
          value = (value * (length - 1) + close) / length;
        }
        out.push(value);
      });
      return out;
    }

    function fetchCandles(symbol, start, end) {
      var requests = [];
      for (var from = start; from < end; from += CANDLES_PER_REQUEST * MINUTE_MS) {
        requests.push(fetch(BINANCE + '/fapi/v1/klines?symbol=' + encodeURIComponent(symbol) + '&interval=1m&startTime=' + from + '&limit=' + CANDLES_PER_REQUEST)
          .then(function(r) {
            if (!r.ok) throw new Error('Binance returned ' + r.status);
            return r.json();
          }));
      }
      return Promise.all(requests).then(function(pages) { return [].concat.apply([], pages); });
    }

    // Returns {labels, closes, fast, slow, volumes, step} for the chart.
    // Volume is the quote volume, so it is in USDT rather than contracts.
    // fast and slow stay empty when the chart has no SMMA lines.
    function buildChartData(candles, start, showDates, showSmma) {
      var closes = candles.map(function(c) { return parseFloat(c[4]); });
      var fast = showSmma ? smma(closes, SMMA_FAST) : [], slow = showSmma ? smma(closes, SMMA_SLOW) : [];
      var first = candles.findIndex(function(c) { return c[0] >= start; });
      if (first < 0) first = candles.length;
      var count = candles.length - first;
      var step = CHART_STEPS.filter(function(s) { return count / s <= MAX_CHART_POINTS; })[0] || CHART_STEPS[CHART_STEPS.length - 1];
      var data = { labels: [], times: [], closes: [], fast: [], slow: [], volumes: [], step: step };
      for (var i = first; i < candles.length; i += step) {
        var last = Math.min(i + step, candles.length) - 1, volume = 0;
        for (var j = i; j <= last; j++) volume += parseFloat(candles[j][7]);
        data.times.push(candles[i][0]);
        data.labels.push(showDates ? dateTimeLabel(candles[i][0]) : timeLabel(candles[i][0]));
        data.closes.push(closes[last]);
        if (showSmma) {
          data.fast.push(fast[last]);
          data.slow.push(slow[last]);
        }
        data.volumes.push(volume);
      }
      return data;
    }

    function clearChart() {
      if (coinChart) coinChart.destroy();
      coinChart = null;
      chartData = null;
    }

    // The New York wall-clock time at ms, written as if it were UTC.
    function newYorkWallMs(ms) {
      var p = {};
      NY_PARTS.formatToParts(new Date(ms)).forEach(function(x) { p[x.type] = +x.value; });
      return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute);
    }

    function newYorkToMs(year, month, day, hour, minute) {
      var guess = Date.UTC(year, month, day, hour, minute);
      return guess - (newYorkWallMs(guess) - guess);
    }

    // Returns [[open, close]] in ms for each US regular session touching start..end.
    function usSessions(start, end) {
      var sessions = [], first = new Date(newYorkWallMs(start - 24 * HOUR_MS));
      for (var k = 0; ; k++) {
        var day = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), first.getUTCDate() + k));
        var y = day.getUTCFullYear(), m = day.getUTCMonth(), d = day.getUTCDate();
        var open = newYorkToMs(y, m, d, 9, 30);
        if (open > end) break;
        var key = y + '-' + pad(m + 1) + '-' + pad(d), weekday = day.getUTCDay();
        if (weekday === 0 || weekday === 6 || US_HOLIDAYS.indexOf(key) !== -1) continue;
        var close = newYorkToMs(y, m, d, US_EARLY_CLOSES.indexOf(key) !== -1 ? 13 : 16, 0);
        if (close > start) sessions.push([open, close]);
      }
      return sessions;
    }

    // Returns [[open, close]] in ms for one Asian market's weekday sessions touching start..end.
    function asianSessions(market, start, end) {
      var sessions = [], first = new Date(start - 24 * HOUR_MS);
      for (var k = 0; ; k++) {
        var day = Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), first.getUTCDate() + k);
        if (day > end) break;
        var weekday = new Date(day).getUTCDay();
        if (weekday === 0 || weekday === 6) continue;
        ASIAN_SESSIONS[market].forEach(function(r) {
          var open = day + (r[0] * 60 + r[1]) * MINUTE_MS, close = day + (r[2] * 60 + r[3]) * MINUTE_MS;
          if (close > start && open < end) sessions.push([open, close]);
        });
      }
      return sessions;
    }

    function marketSessions(market, start, end) {
      return market === 'us' ? usSessions(start, end) : asianSessions(market, start, end);
    }

    function setSessions(list) {
      shownSessions = SESSION_ORDER.filter(function(m) { return list.indexOf(m) !== -1; });
      document.querySelectorAll('#sessionToggle button').forEach(function(b) {
        var on = shownSessions.indexOf(b.dataset.session) !== -1;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on);
      });
    }

    // The x pixel for a time, between the chart's points.
    function timeToPixel(chart, times, t) {
      var n = times.length, i = 0;
      if (t <= times[0]) return chart.scales.x.getPixelForValue(0);
      if (t >= times[n - 1]) return chart.scales.x.getPixelForValue(n - 1);
      while (times[i + 1] < t) i++;
      return chart.scales.x.getPixelForValue(i + (t - times[i]) / (times[i + 1] - times[i]));
    }

    var sessionShade = {
      id: 'sessionShade',
      beforeDatasetsDraw: function(chart, args, options) {
        if (!options.markets.length || !chartData || chartData.times.length < 2) return;
        var times = chartData.times, area = chart.chartArea, ctx = chart.ctx;
        var start = times[0], end = times[times.length - 1] + chartData.step * MINUTE_MS;
        ctx.save();
        options.markets.forEach(function(market) {
          ctx.fillStyle = options.colors[market];
          marketSessions(market, start, end).forEach(function(session) {
            var left = timeToPixel(chart, times, session[0]), right = timeToPixel(chart, times, session[1]);
            if (right > left) ctx.fillRect(left, area.top, right - left, area.bottom - area.top);
          });
        });
        ctx.restore();
      }
    };

    function drawChart() {
      if (typeof Chart === 'undefined' || !chartData) return;
      if (coinChart) coinChart.destroy();
      var s = getComputedStyle(document.documentElement);
      var color = function(name) { return s.getPropertyValue(name).trim(); };
      var secondary = color('--text-secondary');
      // The liquidity floor per bar: $100K a minute, the table's $500K per 5 minutes.
      var floor = MIN_VOLUME_PER_5M / 5 * chartData.step;
      var maxVolume = Math.max(Math.max.apply(null, chartData.volumes), floor);
      var floorColor = '#ef4444';
      var lineSet = function(label, data, borderColor, borderWidth) {
        return { type: 'line', label: label, data: data, yAxisID: 'price', borderColor: borderColor, backgroundColor: borderColor, borderWidth: borderWidth, pointRadius: 0, tension: 0, order: 1 };
      };
      var datasets = [lineSet('Close', chartData.closes, color('--text'), 1.25)];
      if (chartData.fast.length) {
        datasets.push(lineSet('SMMA ' + SMMA_FAST, chartData.fast, color('--smma-fast'), 1.75));
        datasets.push(lineSet('SMMA ' + SMMA_SLOW, chartData.slow, color('--smma-slow'), 1.75));
      }
      datasets.push({ type: 'bar', label: 'Volume (USDT)', data: chartData.volumes, yAxisID: 'volume', backgroundColor: color('--volume') + '99', order: 2 });
      datasets.push({ type: 'line', label: '$' + compactNumber(floor) + ' per ' + (chartData.step === 1 ? 'minute' : chartData.step + ' min') + ' floor', data: chartData.volumes.map(function() { return floor; }), yAxisID: 'volume', borderColor: floorColor, backgroundColor: floorColor, borderWidth: 2, borderDash: [6, 4], pointRadius: 0, pointHitRadius: 0, order: 0, isFloor: true });
      coinChart = new Chart(document.getElementById('coinChart'), {
        data: { labels: chartData.labels, datasets: datasets },
        plugins: [sessionShade],
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: true, labels: { color: secondary, boxWidth: 12 }, position: 'bottom' },
            tooltip: { filter: function(item) { return !item.dataset.isFloor; } },
            sessionShade: {
              markets: shownSessions,
              colors: { us: color('--session-us'), kr: color('--session-kr'), hk: color('--session-hk'), cn: color('--session-cn') }
            }
          },
          scales: {
            x: { ticks: { color: secondary, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 }, grid: { display: false } },
            // Keeps the bars in the bottom quarter, clear of the price lines.
            volume: { position: 'left', beginAtZero: true, max: maxVolume * 4, ticks: { color: secondary, callback: function(v) { return v <= maxVolume ? '$' + compactNumber(v) : null; } }, grid: { display: false } },
            price: { position: 'right', ticks: { color: secondary }, grid: { display: false } }
          }
        }
      });
    }

    // quiet: a refresh, which keeps the title and, if it fails, the last chart.
    function loadChart(quiet) {
      var view = views[currentPeriod];
      if (!view || !selectedCoin) return;
      var symbol = selectedCoin, period = currentPeriod, request = ++chartRequest;
      // Over a week, lines this short only trace the price.
      var showSmma = period !== '7d';
      var title = document.getElementById('coinTitle');
      if (!quiet) title.textContent = symbol + ' — loading 1-minute candles…';
      var length = view.end - view.start, key = symbol + ':' + period, cached = candleCache[key];
      var ready;
      if (cached && Date.now() - cached.at < CANDLE_CACHE_MS) {
        ready = Promise.resolve(cached);
      } else {
        var end = Date.now(), start = end - length;
        ready = fetchCandles(symbol, showSmma ? start - WARMUP_CANDLES * MINUTE_MS : start, end).then(function(candles) {
          candleCache[key] = { at: Date.now(), start: start, candles: candles };
          return candleCache[key];
        });
      }
      ready.then(function(entry) {
        if (request !== chartRequest) return;
        chartData = buildChartData(entry.candles, entry.start, length > 24 * HOUR_MS, showSmma);
        title.textContent = symbol + ' — 1m close' + (showSmma ? ', SMMA ' + SMMA_FAST + ' and ' + SMMA_SLOW : '') + (chartData.step > 1 ? ', drawn every ' + chartData.step + ' minutes' : '');
        drawChart();
      }).catch(function(err) {
        if (request !== chartRequest || (quiet && coinChart)) return;
        clearChart();
        title.textContent = symbol + ' — could not load 1-minute candles: ' + err.message;
      });
    }

    function selectCoin(symbol) {
      selectedCoin = symbol;
      saveState();
      renderCoins();
      loadChart();
    }

    // Remembers the period, filters, search and coin, so a reload keeps them.
    function saveState() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify({
          period: currentPeriod,
          market: currentMarket,
          hideHighCaps: document.getElementById('hideHighCaps').checked,
          sessions: shownSessions,
          search: document.getElementById('coinSearch').value,
          coin: selectedCoin
        }));
      } catch (e) {}
    }

    function restoreState() {
      var state;
      try { state = JSON.parse(localStorage.getItem(STATE_KEY)) || {}; } catch (e) { state = {}; }
      var button = document.querySelector('#periodToggle button[data-period="' + state.period + '"]');
      if (button) {
        currentPeriod = state.period;
        document.querySelectorAll('#periodToggle button').forEach(function(b) { b.classList.toggle('active', b === button); });
      }
      if (['all', 'crypto', 'tradfi'].indexOf(state.market) !== -1) setMarket(state.market);
      document.getElementById('hideHighCaps').checked = state.hideHighCaps === true;
      // Older saves kept only the US session as usSession.
      setSessions(Array.isArray(state.sessions) ? state.sessions : state.usSession === true ? ['us'] : []);
      if (typeof state.search === 'string') document.getElementById('coinSearch').value = state.search;
      if (typeof state.coin === 'string') selectedCoin = state.coin;
    }

    function showPeriod() {
      var view = views[currentPeriod];
      renderHeader(view);
      if (!selectedCoin) {
        var list = visibleCoins(view);
        if (list.length) selectedCoin = list[0][0];
      }
      renderCoins();
      loadChart();
    }

    // The Worker allows a minute of caching, so skip the browser's copy.
    function fetchView(period) {
      if (views[period] && Date.now() - viewAt[period] < REUSE_MS) return Promise.resolve(views[period]);
      return fetch(API_URL + '/coins?period=' + period, { cache: 'no-cache' })
        .then(function(r) {
          if (!r.ok) throw new Error('Server returned ' + r.status);
          return r.json();
        })
        .then(function(view) { views[period] = view; viewAt[period] = Date.now(); return view; });
    }

    // Average volume per 5 minutes over the last 1 and 2 hours, for every coin.
    function loadRecentVolume() {
      RECENT_PERIODS.forEach(function(p) {
        fetchView(p).then(function(view) {
          var slots = (view.end - view.start) / (5 * MINUTE_MS), volumes = {};
          view.coins.forEach(function(c) { volumes[c[0]] = Math.round(c[2] / slots); });
          recentVolume[p] = volumes;
          renderCoins();
        }).catch(function() {});
      });
    }

    function loadPeriod() {
      var period = currentPeriod;
      Promise.all([fetchView(period), tradfiReady]).then(function() {
        if (period === currentPeriod) showPeriod();
      }).catch(function(err) {
        if (period !== currentPeriod) return;
        document.getElementById('coinRows').textContent = '';
        reportStatus('Failed to load', true);
        document.getElementById('coinNote').textContent = 'Failed to load coins: ' + err.message;
      });
    }

    // Resolves once the TradFi list is in, or has failed, so the first coin
    // picked for the chart respects the market filter.
    var tradfiReady = fetch(API_URL + '/coins?period=tradfi')
      .then(function(r) {
        if (!r.ok) throw new Error('Server returned ' + r.status);
        return r.json();
      })
      .then(function(data) {
        var types = data.types || {};
        data.symbols.forEach(function(s) { tradfi[s] = MARKETS[types[s]] || ['TRADFI', 'Stock, ETF or commodity']; });
      })
      .catch(function() {
        setMarket('all');
        document.querySelectorAll('#marketToggle button').forEach(function(b) { b.disabled = true; });
        document.getElementById('marketToggle').title = 'The TradFi list could not be loaded';
      });

    function loadHighCaps() {
      var box = document.getElementById('hideHighCaps');
      fetch(API_URL + '/coins?period=highcap')
        .then(function(r) {
          if (!r.ok) throw new Error('Server returned ' + r.status);
          return r.json();
        })
        .then(function(data) {
          data.symbols.forEach(function(s) { highCaps[s] = true; });
          renderCoins();
        })
        .catch(function() {
          box.checked = false;
          box.disabled = true;
          box.parentNode.title = 'The high-cap list could not be loaded';
        });
    }

    document.getElementById('periodToggle').addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn || btn.dataset.period === currentPeriod) return;
      currentPeriod = btn.dataset.period;
      document.querySelectorAll('#periodToggle button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      saveState();
      loadPeriod();
    });
    document.getElementById('marketToggle').addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn || btn.disabled || btn.dataset.market === currentMarket) return;
      setMarket(btn.dataset.market);
      saveState();
      renderCoins();
    });
    document.getElementById('coinSearch').addEventListener('input', function() { saveState(); renderCoins(); });
    document.getElementById('hideHighCaps').addEventListener('change', function() { saveState(); renderCoins(); });
    document.getElementById('sessionToggle').addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var market = btn.dataset.session;
      setSessions(shownSessions.indexOf(market) === -1 ? shownSessions.concat(market) : shownSessions.filter(function(m) { return m !== market; }));
      saveState();
      drawChart();
    });

    // Every minute, fetch the list, the 1H and 2H volumes and the chart again.
    // A failed refresh keeps what is on screen; the status turns stale on its
    // own. A hidden browser tab skips it and catches up when shown again.
    function refresh() {
      if (document.hidden || !views[currentPeriod]) return;
      loadRecentVolume();
      var period = currentPeriod;
      fetchView(period).then(function() {
        if (period !== currentPeriod) return;
        renderHeader(views[period]);
        renderCoins();
        loadChart(true);
      }, function() {
        if (period === currentPeriod) renderHeader(views[period]);
      });
    }

    restoreState();
    applyTheme(currentTheme);
    loadHighCaps();
    loadRecentVolume();
    loadPeriod();
    setInterval(refresh, REFRESH_MS);
    document.addEventListener('visibilitychange', function() { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
